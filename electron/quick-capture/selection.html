<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'">
    <title>Alan Alıntısı</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; user-select: none; }
        body { background: #fff; cursor: crosshair; }
        #snapshot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        #surface { position: fixed; inset: 0; touch-action: none; }
        #outline { position: absolute; border: 2px solid #2563eb; box-shadow: 0 0 0 1px #fff; pointer-events: none; }
        [hidden] { display: none !important; }
        #cancel { position: fixed; top: 16px; right: 16px; width: 48px; height: 48px; padding: 0; border: 1px solid #d1d5db; border-radius: 12px; background: #fff; color: #374151; font: 28px sans-serif; cursor: pointer; touch-action: none; }
        #cancel:focus-visible { outline: 2px solid #2563eb; }
        body.selecting #cancel { visibility: hidden; }
    </style>
</head>
<body>
    <img id="snapshot" alt="" draggable="false">
    <div id="surface" aria-label="Alıntı alanını sürükleyerek seçin"><div id="outline" hidden></div></div>
    <button id="cancel" type="button" aria-label="Alıntıyı iptal et" title="İptal (Esc)">×</button>
</body>
</html>

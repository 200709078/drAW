<!doctype html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekran Alıntısı</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #capture {
            display: block;
            object-fit: contain;
            user-select: none;
        }

        #interaction {
            position: fixed;
            inset: 0;
            cursor: default;
        }

        #toolbox button img {
            width: 24px;
            height: 24px;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        #selection {
            position: fixed;
            border: 3px solid #60a5fa;
            box-sizing: border-box;
            box-shadow: 0 0 0 9999px rgb(15 23 42 / 58%);
            background: rgb(96 165 250 / 12%);
            pointer-events: none;
        }

        #selection .handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #60a5fa;
            border: 1px solid #fff;
            border-radius: 2px;
            box-sizing: border-box;
            pointer-events: auto;
            z-index: 10;
        }

        #selection .handle--nw {
            left: -6px;
            top: -6px;
            cursor: nwse-resize;
        }

        #selection .handle--n {
            left: 50%;
            top: -6px;
            transform: translateX(-50%);
            cursor: ns-resize;
        }

        #selection .handle--ne {
            right: -6px;
            top: -6px;
            cursor: nesw-resize;
        }

        #selection .handle--e {
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }

        #selection .handle--se {
            right: -6px;
            bottom: -6px;
            cursor: nwse-resize;
        }

        #selection .handle--s {
            left: 50%;
            bottom: -6px;
            transform: translateX(-50%);
            cursor: ns-resize;
        }

        #selection .handle--sw {
            left: -6px;
            bottom: -6px;
            cursor: nesw-resize;
        }

        #selection .handle--w {
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }

        #hint {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgb(15 23 42 / 82%);
            color: white;
            font: 14px system-ui, sans-serif;
            pointer-events: none;
        }

        #toolbox {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 200px;
            padding: 0 0 12px;
            border-radius: 14px;
            background: rgb(15 23 42 / 82%);
            box-shadow: 0 8px 28px rgb(0 0 0 / 45%);
            backdrop-filter: blur(10px);
            color: white;
            font: 14px system-ui, sans-serif;
            z-index: 20;
            overflow: hidden;
        }

        #toolbox .toolbox__titlebar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 6px 8px 12px;
            box-sizing: border-box;
            background: rgb(255 255 255 / 8%);
            cursor: move;
            user-select: none;
            touch-action: none;
        }

        #toolbox .toolbox__title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            user-select: none;
            pointer-events: none;
        }

        #toolbox .toolbox__close {
            width: 26px;
            height: 26px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #toolbox .toolbox__close:hover {
            background: rgb(239 68 68 / 85%);
            color: white;
        }

        #toolbox .toolbox__row {
            width: 100%;
            display: flex;
            gap: 8px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        #toolbox .toolbox__row .toolbox__radio {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            border: 0;
            border-radius: 8px;
            font: 14px system-ui, sans-serif;
            cursor: pointer;
            color: white;
            background: rgb(51 65 85 / 90%);
            transition: background .15s ease;
            user-select: none;
        }

        #toolbox .toolbox__row .toolbox__radio input[type="radio"] {
            position: absolute;
            inset: 0;
            margin: 0;
            opacity: 0;
            cursor: pointer;
        }

        #toolbox .toolbox__row .toolbox__radio img {
            width: 24px;
            height: 24px;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        #toolbox .toolbox__row .toolbox__radio:hover {
            background: #60a5fa;
            color: #0f172a;
        }

        #toolbox .toolbox__row .toolbox__radio:has(input:checked) {
            background: #60a5fa !important;
            color: #0f172a !important;
        }

        #toolbox .toolbox__row .toolbox__radio:has(input:focus-visible) {
            outline: 2px solid #93c5fd;
            outline-offset: 2px;
        }

        #toolbox #captureButton {
            width: 56px;
            height: 56px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            background: linear-gradient(180deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 12px rgb(37 99 235 / 40%);
            transition: filter .15s ease;
        }

        #toolbox #captureButton:hover {
            filter: brightness(1.1);
        }

        #toolbox #captureButton img {
            width: 28px;
            height: 28px;
        }
    </style>
</head>

<body>
    <img id="capture" alt="Ekran alıntısı için seçilecek görüntü">
    <div id="interaction"></div>
    <div id="selection">
        <span class="handle handle--nw" data-dir="nw"></span>
        <span class="handle handle--n" data-dir="n"></span>
        <span class="handle handle--ne" data-dir="ne"></span>
        <span class="handle handle--e" data-dir="e"></span>
        <span class="handle handle--se" data-dir="se"></span>
        <span class="handle handle--s" data-dir="s"></span>
        <span class="handle handle--sw" data-dir="sw"></span>
        <span class="handle handle--w" data-dir="w"></span>
    </div>
    <div id="hint">Alanı sürükleyerek seçin· ESC: İptal</div>
    <div id="toolbox" class="toolbox">
        <div class="toolbox__titlebar">
            <span class="toolbox__title">Ekran Alıntısı</span>
            <button type="button" id="cancelButton" class="toolbox__close" title="İptal: Yakalamayı iptal et"
                aria-label="İptal">×</button>
        </div>
        <div class="toolbox__row" role="radiogroup" aria-label="Yakalama Modu">
            <label class="toolbox__radio" title="Seçim: Belirli bir alanı seç">
                <input type="radio" name="captureMode" id="selectionButton" value="selection" checked>
                <img src="./assets/icons/area_select.svg" alt="" draggable="false">
            </label>
            <label class="toolbox__radio" title="Ekran: Ekranın tamamını seç">
                <input type="radio" name="captureMode" id="screenButton" value="screen">
                <img src="./assets/icons/fullscreen.svg" alt="" draggable="false">
            </label>
        </div>


        <button type="button" id="captureButton" aria-label="Yakala" title="Yakala">
            <img src="./assets/icons/capture.svg" alt="" draggable="false">
        </button>

    </div>
</body>

</html>

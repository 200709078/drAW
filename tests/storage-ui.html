<!doctype html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Storage UI regression checks</title></head>
<body>
<div id="app"></div><pre id="result">RUNNING</pre>
<script type="module">
import { Application } from "/src/core/Application.ts";
import { Point } from "/src/document/Point.ts";
import { Stroke } from "/src/document/Stroke.ts";
import { DocumentStateSerializer } from "/src/autosave/DocumentStateSerializer.ts";

const result = document.getElementById("result");
const records = new Map();
const errors = [];
let failSave = false;
let saveGate = null;
let waitingAtGate = false;
let shutdownRequest;
let completed = 0;
let cancelled = 0;
window.addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));
window.drAWDesktop = {
    storage: {
        async save(record) {
            if (saveGate !== null) {
                waitingAtGate = true;
                await saveGate;
            }
            if (failSave) return { ok: false, error: { kind: "disk-full", message: "Disk dolu" } };
            records.set(record.id, structuredClone(record));
            return { ok: true };
        },
        async load(id) { return { ok: true, value: records.get(id) ?? null }; },
        async list() { return { ok: true, value: [...records.values()] }; },
        async delete(id) { records.delete(id); return { ok: true }; },
        async rename(id, name) { records.get(id).displayName = name; return { ok: true }; }
    },
    onShutdownRequest(callback) { shutdownRequest = callback; },
    shutdownComplete() { completed++; },
    shutdownCancelled() { cancelled++; }
};

const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
function assert(value, message) { if (!value) throw new Error(message); }
async function until(check) {
    for (let attempt = 0; attempt < 100; attempt++) {
        if (check()) return;
        await delay(20);
    }
    throw new Error("Timed out waiting for UI operation");
}
async function dismissError() {
    await until(() => document.querySelector(".modal"));
    document.querySelector(".modal__button--confirm").click();
    await delay(0);
}

try {
    const app = new Application();
    const managers = app.getManagers();
    const auto = managers.getAutoSaveManager();
    const drawing = managers.getDocument();
    const history = managers.getHistoryManager();
    const newButton = document.querySelector('button[aria-label="Yeni Çizim"]');
    function draw(x) {
        history.begin();
        const stroke = new Stroke();
        stroke.addPoint(new Point(x, 100, 1));
        drawing.getCurrentPage().addStroke(stroke);
        history.commit();
    }

    draw(10);
    await auto.saveIfNeeded();
    const otherId = auto.getActiveDocument().getId();
    newButton.click();
    await until(() => drawing.getCurrentPage().getStrokes().length === 0);
    draw(20);
    const activeId = auto.getActiveDocument().getId();
    const preserve = () => {
        assert(drawing.getCurrentPage().getStrokes()[0]?.getPoints()[0].getX() === 20, "drawing was lost");
        assert(auto.getActiveDocument().getId() === activeId, "active record changed");
        assert(history.canUndo(), "undo history was lost");
        assert(auto.isDirty(), "unsaved drawing was marked clean");
    };
    failSave = true;

    newButton.click();
    await dismissError();
    preserve();
    assert(!newButton.disabled, "new drawing stayed disabled after a failed save");

    await until(() => document.querySelector(`[data-id="${otherId}"] .drawings-card__open`));
    document.querySelector(`[data-id="${otherId}"] .drawings-card__open`).click();
    await dismissError();
    preserve();

    shutdownRequest();
    await dismissError();
    preserve();
    assert(cancelled === 1 && completed === 0, "failed shutdown was approved");

    failSave = false;
    newButton.click();
    await until(() => drawing.getCurrentPage().getStrokes().length === 0);
    assert(records.get(activeId).canvasState.data.strokes[0].points[0][0] === 20, "retry did not save the drawing");
    assert(!history.canUndo(), "successful new drawing retained old undo history");

    // Exercise the production wiring between linked photos, the toolbar, and autosave.
    const photoCanvas = document.createElement("canvas");
    photoCanvas.width = photoCanvas.height = 2;
    const context = photoCanvas.getContext("2d");
    const photoData = ["red", "blue", "green"].map((color) => {
        context.fillStyle = color;
        context.fillRect(0, 0, 2, 2);
        return photoCanvas.toDataURL();
    });
    let photoGate = null;
    let listingGate = null;
    let photoFailure = null;
    window.drAWDesktop.photoFolder = {
        async selectPhoto() { return { folderPath: "/photos", fileName: "1.png" }; },
        async listPhotos() {
            if (listingGate !== null) {
                waitingAtGate = true;
                await listingGate;
            }
            if (photoFailure === "list") return null;
            if (photoFailure === "ipc") throw new Error("Photo IPC unavailable");
            return ["1.png", "2.png", "3.png"];
        },
        async readPhoto(_folder, name) {
            if (photoFailure === "read") return null;
            if (photoGate !== null) {
                waitingAtGate = true;
                await photoGate;
            }
            return { dataUrl: photoData[Number(name[0]) - 1], width: 2, height: 2 };
        }
    };
    const photos = managers.getPhotoLinkManager();
    await photos.toggle();
    assert(auto.isDirty(), "photo-only drawing was not marked dirty");
    assert(!history.canUndo(), "photo was added to undo history");
    await auto.saveIfNeeded();
    const photoId = auto.getActiveDocument().getId();
    assert(records.get(photoId).canvasState.data.images[0].dataUrl === photoData[0], "photo-only drawing was not saved");

    draw(30);
    const undoButton = document.querySelector('button[aria-label="Çizimi Geri Al"]');
    const redoButton = document.querySelector('button[aria-label="Çizimi Yinele"]');
    undoButton.click();
    assert(photos.isLinked(), "undoing a stroke disconnected the folder");
    assert(drawing.getCurrentPage().getStrokes().length === 0, "undo did not remove the stroke");
    assert(photos.isLinkedHolder(drawing.getCurrentPage().getImages()[0]), "restored photo was not recognized as linked");
    redoButton.click();
    assert(photos.isLinked(), "redoing a stroke disconnected the folder");
    assert(drawing.getCurrentPage().getStrokes().length === 1, "redo did not restore the stroke");
    for (const failure of ["list", "ipc", "read"]) {
        photoFailure = failure;
        newButton.click();
        await dismissError();
        photoFailure = null;
        assert(!newButton.disabled, `${failure}: new drawing stayed disabled after photo access failed`);
        assert(photos.isLinked(), `${failure}: photo access failure disconnected the folder`);
        assert(JSON.parse(localStorage.getItem("draw:photo-link")).fileName === "1.png", `${failure}: current photo changed`);
        assert(drawing.getCurrentPage().getImages()[0]?.getDataUrl() === photoData[0], `${failure}: original photo was lost`);
        assert(drawing.getCurrentPage().getStrokes()[0]?.getPoints()[0].getX() === 30, `${failure}: drawing was lost`);
        assert(auto.getActiveDocument().getId() === photoId, `${failure}: active drawing changed`);
        assert(history.canUndo(), `${failure}: undo history was lost`);
        assert(auto.isDirty(), `${failure}: unsaved drawing was marked clean`);
    }

    managers.getSelectionTool().selectImage(drawing.getCurrentPage().getImages()[0]);
    const nextPhotoButton = document.querySelector('button[aria-label="Sonraki Fotoğraf"]');
    assert(nextPhotoButton && !nextPhotoButton.hidden && !nextPhotoButton.disabled, "photo navigation unavailable after undo/redo");
    nextPhotoButton.click();
    await until(() => drawing.getCurrentPage().getImages()[0].getDataUrl() === photoData[1]);
    assert(auto.isDirty(), "photo change was not marked dirty");
    undoButton.click();
    assert(photos.isLinked(), "undo after photo navigation disconnected the folder");
    assert(drawing.getCurrentPage().getImages().length === 1, "undo duplicated the linked photo");
    assert(drawing.getCurrentPage().getImages()[0].getDataUrl() === photoData[1], "undo restored an outdated photo");
    assert(JSON.parse(localStorage.getItem("draw:photo-link")).fileName === "2.png", "undo changed the linked file name");
    redoButton.click();
    assert(photos.isLinked(), "redo after photo navigation disconnected the folder");
    assert(drawing.getCurrentPage().getImages()[0].getDataUrl() === photoData[1], "redo restored an outdated photo");
    failSave = true;
    newButton.click();
    await dismissError();
    assert(JSON.parse(localStorage.getItem("draw:photo-link")).fileName === "2.png", "failed new drawing advanced the photo");
    assert(drawing.getCurrentPage().getImages()[0].getDataUrl() === photoData[1], "failed new drawing replaced the photo");

    failSave = false;
    newButton.click();
    await until(() => drawing.getCurrentPage().getImages()[0]?.getDataUrl() === photoData[2]);
    assert(auto.isDirty(), "new drawing's prepared photo was not marked dirty");
    assert(records.get(photoId).canvasState.data.images[0].dataUrl === photoData[1], "previous photo drawing was not saved before transition");
    await auto.saveIfNeeded();
    assert(records.get(auto.getActiveDocument().getId()).canvasState.data.images[0].dataUrl === photoData[2], "prepared photo was not saved");
    assert(!history.canUndo(), "photo transition added an undo entry");

    // Manually unlinking keeps the current photo; New Drawing must clear its selection too.
    const unlinkedPhoto = drawing.getCurrentPage().getImages()[0];
    await photos.toggle();
    assert(!photos.isLinked() && drawing.getCurrentPage().getImages()[0] === unlinkedPhoto,
        "manual unlink removed the photo from the current drawing");
    newButton.click();
    await until(() => drawing.getCurrentPage().getImages().length === 0 && !newButton.disabled);
    assert(managers.getDocumentRenderer().getSelectionBounds() === null,
        "manual unlink followed by New Drawing retained an empty photo frame");
    assert(auto.getActiveDocument().getCanvasState().getData().images.length === 0,
        "manual unlink left a placeholder image in the new record");
    assert(managers.getToolManager().getActiveTool() === managers.getPenTool(),
        "an empty new drawing did not use the normal pen");
    document.querySelector('button[aria-label="Seç ve Taşı"]').click();
    assert(managers.getDocumentRenderer().getSelectionBounds() === null,
        "returning to selection restored the unlinked photo frame");

    // Repeated clicks must not overlap while loading a photo or saving a drawing.
    let transitions = 0;
    window.addEventListener("newdraw:started", () => transitions++);
    for (const blockedPhase of ["photo", "save"]) {
        if (photos.isLinked()) await photos.toggle();
        newButton.click();
        await until(() => drawing.getCurrentPage().getImages().length === 0 && !newButton.disabled);
        await photos.toggle();
        const originalId = auto.getActiveDocument().getId();
        const before = transitions;
        let release;
        const gate = new Promise((resolve) => { release = resolve; });
        waitingAtGate = false;
        if (blockedPhase === "photo") photoGate = gate;
        else saveGate = gate;

        newButton.click();
        newButton.click();
        await until(() => waitingAtGate);
        // dispatchEvent also exercises the guard when a click bypasses native disabled handling.
        newButton.dispatchEvent(new MouseEvent("click"));
        await delay(40);
        assert(transitions === before, `${blockedPhase}: transition completed before its dependency`);
        const disabledDuringOperation = newButton.disabled;
        assert(auto.getActiveDocument().getId() === originalId, `${blockedPhase}: active drawing changed early`);

        photoGate = saveGate = null;
        release();
        await until(() => transitions > before && !newButton.disabled);
        await delay(40);
        assert(photos.isLinked(), `${blockedPhase}: repeated clicks disconnected the folder`);
        assert(transitions === before + 1, `${blockedPhase}: repeated clicks started multiple drawings`);
        assert(disabledDuringOperation, `${blockedPhase}: new drawing button was not disabled`);
        assert(JSON.parse(localStorage.getItem("draw:photo-link")).fileName === "2.png", `${blockedPhase}: photo advanced incorrectly`);
        assert(localStorage.getItem("draw:photo-last-folder") === "/photos", `${blockedPhase}: last folder was lost`);
        assert(drawing.getCurrentPage().getImages().length === 1, `${blockedPhase}: duplicate photo`);
        assert(drawing.getCurrentPage().getImages()[0].getDataUrl() === photoData[1], `${blockedPhase}: incorrect photo`);
        assert(managers.getToolManager().getActiveTool() === managers.getSelectionTool(), `${blockedPhase}: linked new drawing did not activate selection`);
        assert(document.querySelector('button[aria-label="Seç ve Taşı"]').getAttribute("aria-pressed") === "true", `${blockedPhase}: selection button was not marked active`);
        assert(managers.getDocumentRenderer().getSelectionBounds() !== null, `${blockedPhase}: the new photo was not selected`);
        assert(records.get(originalId).canvasState.data.images[0].dataUrl === photoData[0], `${blockedPhase}: original photo was not saved`);

        newButton.click();
        await until(() => transitions === before + 2 && !newButton.disabled);
        assert(photos.isLinked(), `${blockedPhase}: folder disconnected on the next separate click`);
        assert(drawing.getCurrentPage().getImages()[0].getDataUrl() === photoData[2], `${blockedPhase}: next separate click did not advance`);
    }

    // Erasing beside the photo must preserve its link, including after undo/redo and save.
    const viewport = managers.getDrawingContext().getViewport();
    const canvas = managers.getCanvasManager().getCanvas();
    for (const eraser of [managers.getEraserTool(), managers.getPartialEraserTool()]) {
        const photo = drawing.getCurrentPage().getImages()[0];
        const outsideX = photo.getX() + photo.getWidth() + 1;
        draw(outsideX);
        managers.getToolManager().setTool(eraser);
        const offsetX = viewport.worldToScreenX(outsideX);
        const offsetY = viewport.worldToScreenY(100);
        const bounds = canvas.getBoundingClientRect();
        const touch = {
            pointerId: 1, pointerType: "touch", offsetX, offsetY,
            clientX: bounds.left + offsetX, clientY: bounds.top + offsetY
        };
        eraser.onPointerDown(touch);
        eraser.onPointerUp(touch);
        assert(drawing.getCurrentPage().getStrokes().length === 0, "eraser did not remove the nearby stroke");
        assert(drawing.getCurrentPage().getImages()[0] === photo, "eraser removed a photo from outside its bounds");
        assert(photos.isLinked(), "erasing beside the photo disconnected the folder");
        undoButton.click();
        assert(drawing.getCurrentPage().getStrokes().length === 1, "undo did not restore the erased stroke");
        redoButton.click();
        assert(drawing.getCurrentPage().getStrokes().length === 0, "redo did not erase the stroke again");
        assert(photos.isLinked(), "undo/redo after erasing disconnected the folder");
        assert(photos.isLinkedHolder(drawing.getCurrentPage().getImages()[0]), "erasing history lost the linked photo identity");
        await auto.saveIfNeeded();
        const saved = records.get(auto.getActiveDocument().getId()).canvasState.data;
        assert(saved.images.length === 1 && saved.images[0].dataUrl === photoData[2], "erasing did not preserve the saved photo");
        assert(saved.strokes.length === 0, "erased stroke remained in the saved drawing");
    }
    managers.getToolManager().setTool(managers.getPenTool());

    // Opening a saved drawing must clear the previous photo's link before another edit.
    const linkButton = document.querySelector('button[aria-label="Klasör bağını kopar"]');
    const linkedId = auto.getActiveDocument().getId();
    draw(75);
    await until(() => document.querySelector(`[data-id="${otherId}"] .drawings-card__open`));
    const openOtherButton = document.querySelector(`[data-id="${otherId}"] .drawings-card__open`);
    failSave = true;
    openOtherButton.click();
    await dismissError();
    assert(auto.getActiveDocument().getId() === linkedId && photos.isLinked(), "failed open lost the active drawing or photo link");
    assert(drawing.getCurrentPage().getImages()[0]?.getDataUrl() === photoData[2], "failed open lost the linked photo");
    failSave = false;
    openOtherButton.click();
    await until(() => auto.getActiveDocument().getId() === otherId);
    assert(drawing.getCurrentPage().getImages().length === 0, "opened drawing retained the previous photo");
    assert(drawing.getCurrentPage().getStrokes()[0]?.getPoints()[0].getX() === 10, "wrong drawing was opened");
    assert(!photos.isLinked(), "opened drawing retained the previous folder link");
    assert(localStorage.getItem("draw:photo-link") === null, "old photo link remained stored after opening a drawing");
    assert(localStorage.getItem("draw:photo-last-folder") === "/photos", "opening a drawing forgot the last folder");
    assert(document.querySelector(".link-status").hidden, "old photo path remained visible");
    assert(linkButton.getAttribute("aria-label") === "Klasör bağla", "link button still offered to disconnect the old photo");
    assert(!history.canUndo() && !auto.isDirty(), "opened drawing retained undo history or was marked unsaved");
    assert(records.get(linkedId).canvasState.data.strokes[0].points[0][0] === 75, "opening a drawing lost the previous edits");

    const pickerPaths = [];
    window.drAWDesktop.photoFolder.selectPhoto = async (defaultPath) => {
        pickerPaths.push(defaultPath);
        return { folderPath: "/photos", fileName: "1.png" };
    };
    linkButton.click();
    await until(() => photos.isLinked());
    assert(pickerPaths.length === 1 && pickerPaths[0] === "/photos", "reconnecting needed a second click or forgot the folder");
    assert(drawing.getCurrentPage().getImages()[0]?.getDataUrl() === photoData[0], "reconnecting did not add the selected photo");

    // A delayed next-photo read must not insert its photo into a drawing opened meanwhile.
    await delay(0);
    await until(() => document.querySelector(`[data-id="${activeId}"] .drawings-card__open`));
    const delayedOpenTarget = document.querySelector(`[data-id="${activeId}"] .drawings-card__open`);
    assert(auto.getActiveDocument().getId() !== activeId, "delayed photo test must open a different drawing");
    let releaseStep;
    photoGate = new Promise((resolve) => { releaseStep = resolve; });
    waitingAtGate = false;
    const currentNextPhotoButton = document.querySelector('button[aria-label="Sonraki Fotoğraf"]');
    assert(currentNextPhotoButton && !currentNextPhotoButton.disabled, "reconnected folder has no next-photo control");
    currentNextPhotoButton.click();
    await until(() => waitingAtGate);
    delayedOpenTarget.click();
    await until(() => auto.getActiveDocument().getId() === activeId);
    photoGate = null;
    releaseStep();
    await until(() => !photos.busy);
    assert(drawing.getCurrentPage().getImages().length === 0, "a late photo result changed the opened drawing");
    assert(drawing.getCurrentPage().getStrokes()[0]?.getPoints()[0].getX() === 20, "a late photo result changed the opened strokes");
    assert(!photos.isLinked() && !auto.isDirty(), "a late photo result reactivated the link or marked the opened drawing dirty");
    assert(!document.querySelector(".modal"), "a cancelled photo request showed a misleading error");
    assert(records.get(activeId).canvasState.data.images.length === 0, "a late photo was saved into the opened drawing");

    // A first-time folder link must also stop when its drawing changes during the read.
    for (const change of ["new drawing", "open drawing"]) {
        draw(90);
        const beforeId = auto.getActiveDocument().getId();
        let releaseLink;
        photoGate = new Promise((resolve) => { releaseLink = resolve; });
        waitingAtGate = false;
        linkButton.click();
        await until(() => waitingAtGate);
        assert(!photos.isLinked(), "folder linked before its photo finished loading");
        if (change === "new drawing") {
            newButton.click();
            await until(() => auto.getActiveDocument().getId() !== beforeId && !newButton.disabled);
        } else {
            delayedOpenTarget.click();
            await until(() => auto.getActiveDocument().getId() === activeId);
        }
        const opened = drawing.createSnapshot();
        photoGate = null;
        releaseLink();
        await until(() => !photos.busy);
        assert(drawing.snapshotsMatch(opened, drawing.createSnapshot()), `${change}: cancelled folder link changed the drawing`);
        assert(!photos.isLinked() && !auto.isDirty(), `${change}: cancelled folder link reactivated or dirtied the drawing`);
        assert(localStorage.getItem("draw:photo-link") === null, `${change}: cancelled folder link was persisted`);
    }
    linkButton.click();
    await until(() => photos.isLinked() && !photos.busy);
    assert(drawing.getCurrentPage().getImages().length === 1, "cancelled folder linking blocked a later reconnect");
    assert(pickerPaths.at(-1) === "/photos", "cancelled folder linking forgot the last folder");

    // Opening another record cancels New Drawing during preparation and during its save.
    const serializer = new DocumentStateSerializer();
    for (const [phase, mode] of [
        ["list", "next photo"], ["read", "next photo"],
        ["save", "next photo"], ["save", "last photo"], ["save", "unlinked"]
    ]) {
        const label = `${phase}/${mode}`;
        if (photos.isLinked()) await photos.toggle();
        const beforeSetupId = auto.getActiveDocument().getId();
        newButton.click();
        await until(() => auto.getActiveDocument().getId() !== beforeSetupId && !newButton.disabled);
        if (mode !== "unlinked") {
            await photos.toggle();
            if (mode === "last photo") {
                for (const name of ["2.png", "3.png"]) {
                    photos.requestStepPhoto(1);
                    await until(() => JSON.parse(localStorage.getItem("draw:photo-link")).fileName === name && !photos.busy);
                }
            }
        }
        draw(130);
        const originalId = auto.getActiveDocument().getId();
        assert(originalId !== otherId, `${label}: test must open a different record`);
        await until(() => document.querySelector(`[data-id="${otherId}"] .drawings-card__open`));
        const openTarget = document.querySelector(`[data-id="${otherId}"] .drawings-card__open`);
        const expected = serializer.deserialize(records.get(otherId).canvasState.data);
        const before = transitions;
        let release;
        const gate = new Promise((resolve) => { release = resolve; });
        waitingAtGate = false;
        if (phase === "list") listingGate = gate;
        else if (phase === "read") photoGate = gate;
        else saveGate = gate;

        if (phase === "save") {
            openTarget.click();
            await until(() => waitingAtGate);
            newButton.click();
            await delay(40);
            assert(newButton.disabled && auto.getActiveDocument().getId() === originalId,
                `${label}: new drawing did not wait for the current save`);
        } else {
            newButton.click();
            await until(() => waitingAtGate);
            openTarget.click();
            await until(() => auto.getActiveDocument().getId() === otherId);
            assert(!photos.isLinked(), `${label}: old folder link remained active during preparation`);
        }
        listingGate = photoGate = saveGate = null;
        release();
        await until(() => !newButton.disabled);
        assert(auto.getActiveDocument().getId() === otherId, `${label}: new drawing replaced the opened record`);
        assert(drawing.snapshotsMatch(expected, drawing.createSnapshot()), `${label}: new drawing changed the opened content`);
        assert(transitions === before, `${label}: obsolete new drawing completed a transition`);
        assert(!photos.isLinked() && !auto.isDirty() && !history.canUndo(), `${label}: opened record retained link, dirty state or undo history`);
        assert(!document.querySelector(".modal"), `${label}: obsolete preparation showed an error`);
        assert(records.get(originalId).canvasState.data.strokes[0].points[0][0] === 130, `${label}: original drawing was not saved`);
        assert(localStorage.getItem("draw:photo-last-folder") === "/photos", `${label}: last folder was lost`);
    }

    // Linking with selection already active must keep the newly inserted photo selected.
    for (const mode of ["manual link", "restore"]) {
        if (photos.isLinked()) await photos.toggle();
        const beforeId = auto.getActiveDocument().getId();
        newButton.click();
        await until(() => auto.getActiveDocument().getId() !== beforeId && !newButton.disabled);
        document.querySelector('button[aria-label="Seç ve Taşı"]').click();
        if (mode === "manual link") {
            linkButton.click();
            await until(() => photos.isLinked() && !photos.busy);
        } else {
            localStorage.setItem("draw:photo-link", JSON.stringify({ folderPath: "/photos", fileName: "1.png" }));
            await photos.restore();
        }
        assert(managers.getToolManager().getActiveTool() === managers.getSelectionTool(), `${mode}: selection is not active`);
        assert(drawing.getCurrentPage().getImages().length === 1, `${mode}: linked photo was not inserted`);
        assert(managers.getDocumentRenderer().getSelectionBounds() !== null, `${mode}: activating selection cleared the new photo's selection`);
        const next = document.querySelector('button[aria-label="Sonraki Fotoğraf"]');
        assert(next && !next.hidden && !next.disabled, `${mode}: next-photo control is unavailable`);
        assert(document.querySelectorAll('button[aria-label="Sonraki Fotoğraf"]').length === 1 &&
            document.querySelectorAll('button[aria-label="Önceki Fotoğraf"]').length === 1,
            `${mode}: old photo navigation buttons remained after switching tools`);
    }

    // A pending photo read can finish after the user switches back to the pen.
    let releaseLateRead;
    photoGate = new Promise((resolve) => { releaseLateRead = resolve; });
    waitingAtGate = false;
    document.querySelector('button[aria-label="Sonraki Fotoğraf"]').click();
    await until(() => waitingAtGate);
    document.querySelector('button[aria-label="Kalem: Normal Kalem"]').click();
    photoGate = null;
    releaseLateRead();
    await until(() => !photos.busy);
    assert(managers.getToolManager().getActiveTool() === managers.getPenTool(), "late photo navigation changed the chosen tool");
    await photos.toggle();
    const beforeUnlinkedNew = auto.getActiveDocument().getId();
    newButton.click();
    await until(() => auto.getActiveDocument().getId() !== beforeUnlinkedNew && !newButton.disabled);
    assert(drawing.getCurrentPage().getImages().length === 0 && managers.getDocumentRenderer().getSelectionBounds() === null,
        "late photo navigation left an empty frame after unlink and New Drawing");
    document.querySelector('button[aria-label="Seç ve Taşı"]').click();
    managers.getSelectionTool().deleteSelection();
    assert(!auto.isDirty() && !history.canUndo(), "selection retained a removed photo after an empty New Drawing");

    // Resizing a linked photo must reach the release point, save, and preserve its folder link.
    await photos.toggle();
    viewport.zoomAt(0, 0, 2);
    const selection = managers.getSelectionTool();
    for (const pointerType of ["touch", "pen", "mouse"]) {
        const image = drawing.getCurrentPage().getImages()[0];
        const original = [image.getX(), image.getY(), image.getWidth(), image.getHeight()];
        selection.selectImage(image);
        const right = image.getX() + image.getWidth();
        const bottom = image.getY() + image.getHeight();
        const pointer = (x, y) => ({
            pointerId: 10, pointerType, shiftKey: false, ctrlKey: false, metaKey: false,
            offsetX: viewport.worldToScreenX(x), offsetY: viewport.worldToScreenY(y)
        });
        selection.onPointerDown(pointer(right - 2, bottom - 2));
        selection.onPointerMove(pointer(right + 58, bottom + 58));
        selection.onPointerUp(pointer(right + 118, bottom + 118));
        const resized = [image.getX(), image.getY(), image.getWidth(), image.getHeight()];
        assert(resized[0] === original[0] && resized[1] === original[1] &&
            resized[2] === original[2] + 120 && resized[3] === original[3] + 120,
            `${pointerType}: linked photo did not reach the release point`);
        assert(photos.isLinked() && auto.isDirty(), `${pointerType}: resize disconnected the folder or was not marked dirty`);
        undoButton.click();
        redoButton.click();
        const restored = drawing.getCurrentPage().getImages()[0];
        assert(photos.isLinkedHolder(restored) && restored.getWidth() === resized[2] && restored.getHeight() === resized[3],
            `${pointerType}: resize undo/redo lost the final geometry or the folder link`);
        await auto.saveIfNeeded();
        const saved = records.get(auto.getActiveDocument().getId()).canvasState.data.images;
        assert(saved.length === 1 && saved[0].width === resized[2] && saved[0].height === resized[3],
            `${pointerType}: resized photo was not saved correctly`);
        undoButton.click();
    }
    viewport.reset();

    assert(errors.length === 0, `unhandled rejection: ${errors.join(", ")}`);
    await auto.shutdown();
    result.textContent = "PASS: storage failures, photo history, erasing and new-drawing transitions work; delayed photo navigation, folder linking and New Drawing cannot change another opened record; reconnect still remembers the folder";
} catch (error) {
    result.textContent = `FAIL: ${error.stack ?? error}`;
}
</script>
</body>
</html>
